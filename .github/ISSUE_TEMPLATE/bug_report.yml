name: Bug report
description: Report a reproducible problem with Terraproof.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and read CONTRIBUTING.md before reporting.
        This issue is public. Remove secrets, tokens, personal data, confidential prompts and private datasets from all examples, logs and attachments. Do not post sensitive vulnerability details here.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Task routing or skill selection
        - Apply or bundle export
        - Skill content or instructions
        - Python checks / evidence report
        - Dataset inspection
        - Setup or CLI
        - Documentation
        - Other or unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Terraproof version or commit
      description: Include the commit SHA for a source checkout and how you installed or ran Terraproof.
      placeholder: "Commit SHA, source checkout / package installation"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js and npm versions. For agent integration, include the agent/tool and version.
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version (if relevant)
      description: Needed for the python -m terraproof command, Python checks, or dataset inspection.
      placeholder: "for example 3.11.9"
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give exact commands, flags, sanitized task text and the smallest example. For export bugs, describe the target directory state without sharing private paths or files.
      placeholder: |
        1. Start from...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: python_report
    attributes:
      label: python -m terraproof command and report (if relevant)
      description: Paste the exact command and the report or error output. Remove private paths, datasets and secrets; a minimal sample file is more useful than a private one.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen? For routing issues, name the skills you expected and explain why.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include selected skills, incorrect output or the exact error when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or supporting evidence
      description: Optional minimal logs, screenshots or a public reproduction. Remove secrets and personal data before pasting or uploading.
  - type: textarea
    id: checks
    attributes:
      label: Checks or workarounds tried
      description: List commands and results, if any. Say what you have not tested; do not assume a check passed.
