name: CI - Terraproof Integrity, Router & Package Smoke Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills, Links, Router & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dev dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run Terraproof Integrity Validator
        run: |
          python tests/validate_repo.py

      - name: Run Smart Router Validation & Scenario Suite
        run: |
          npm run test:router

      - name: Verify generated registry freshness
        run: npm run registry:check

      - name: Verify npm package tarball
        run: |
          npm pack --dry-run 2>&1 | head -50

  package-smoke:
    name: Package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Pack, install, and run the package
        run: npm run test:package

  python:
    name: Python core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install terraproof with dev and mcp extras
        run: python -m pip install -e ".[dev,mcp]"

      - name: Run Python tests
        run: python -m pytest -q tests/python

      - name: Run executable deterministic evals
        run: python -m terraproof.evals run

      - name: Build Python wheel
        run: python -m pip wheel . --no-deps --wheel-dir .terracache/wheels

      - name: Verify built wheel outside the checkout
        run: python tests/package/python_smoke.py .terracache/wheels

      - name: Validate release CLI and actual MCP stdio transport
        run: python tests/release_validation.py --out .terracache/release-validation.json

      - name: Upload independent release validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ matrix.os }}-python-${{ matrix.python }}
          path: .terracache/release-validation.json
          if-no-files-found: warn
