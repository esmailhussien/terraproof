name: Publish Python package (TestPyPI, then PyPI)

# Phase 6 B3. A version tag on main builds the product-only wheel and sdist once, installs that
# wheel cleanly on every OS, publishes it to TestPyPI, installs it back from TestPyPI, and only
# then publishes the same files to PyPI and installs from there. Publishing uses PyPI Trusted
# Publishing (OIDC); no token is stored. The maintainer creates the `terraproof` projects on
# TestPyPI and PyPI, registers this workflow as their trusted publisher, and protects the
# `pypi` environment with a required reviewer.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build wheel and sdist
    if: github.repository == 'esmailhussien/terraproof'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag matches the package version
        id: version
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match pyproject version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")

      - name: Build
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: The distributions hold no benchmark or harness code
        shell: python
        run: |
          import pathlib, tarfile, zipfile
          for path in pathlib.Path("dist").iterdir():
              names = (zipfile.ZipFile(path).namelist() if path.suffix == ".whl"
                       else tarfile.open(path).getnames())
              leaked = [n for n in names if "terraproof/evals/" in n or "data/evals/" in n]
              if leaked:
                  raise SystemExit(f"{path.name} contains {leaked[:5]}")

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  wheel-smoke:
    name: Clean install from the built wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - run: python tests/package/clean_install_smoke.py --wheel dist

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, wheel-smoke]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-install:
    name: Install from TestPyPI (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build, publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python tests/package/clean_install_smoke.py --index https://test.pypi.org/simple/
          --extra-index https://pypi.org/simple/ --version ${{ needs.build.outputs.version }}

  publish-pypi:
    name: Publish to PyPI
    needs: [build, testpypi-install]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  pypi-install:
    name: Install from PyPI (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build, publish-pypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python tests/package/clean_install_smoke.py --index https://pypi.org/simple/
          --version ${{ needs.build.outputs.version }}
