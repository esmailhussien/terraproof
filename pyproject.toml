[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terraproof"
version = "0.9.0"
description = "Evidence-graded skills, tools, and checks for mapping and remote-sensing AI agents. By Geova."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Terraproof Contributors" }]
keywords = ["gis", "geospatial", "remote-sensing", "agents", "validation", "crs", "raster", "vector"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "pyproj",
  "shapely>=2",
  "numpy",
  "pyogrio",
  "rasterio",
]

[project.optional-dependencies]
dev = ["pytest", "setuptools>=77"]
semantic = ["fastembed==0.9.0"]
# Optional: the MCP server (`python -m terraproof.mcp`). The core install stays dependency-light.
# The official Python SDK's current stable line is 2.x, where FastMCP is renamed MCPServer
# (https://py.sdk.modelcontextprotocol.io/whats-new/#fastmcp-is-now-mcpserver).
mcp = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/esmailhussien/terraproof"
Repository = "https://github.com/esmailhussien/terraproof"

[tool.setuptools.packages.find]
where = ["src"]
# Product-only distributions: the benchmark and the lift harness (recipes, oracles, fixtures and
# task specs) run from a checkout and are never installed beside the checks they grade.
exclude = ["terraproof.evals", "terraproof.evals.*"]

[tool.setuptools.cmdclass]
build_py = "terraproof._build.BuildPy"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Import this checkout's package first, even when the environment has an editable
# install of another checkout (for example a shared venv used by git worktrees).
pythonpath = ["src"]
# Python on some Windows setups cannot write to the user temp directory, so
# pytest's tmp_path root is kept inside the (git-ignored) pytest cache instead.
addopts = "--basetemp=.pytest_cache/basetemp"
